<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Goal Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>Goal Tracker</h1>
    <button id="openConfigBtn" class="btn secondary">Weekly Config</button>
  </header>

  <main class="app-main">
    <section class="goal-cards">
      <article class="goal-card"><h3>Weekly Goal</h3><p id="weeklyGoalText">Not set</p></article>
      <article class="goal-card"><h3>Monthly Goal</h3><p id="monthlyGoalText">Not set</p></article>
      <article class="goal-card"><h3>End Goal</h3><p id="endGoalText">Not set</p></article>
      <button id="editGoalsBtn" class="btn small">Edit Goals</button>
    </section>

    <section class="toolbar">
      <button id="viewWindowBtn" class="btn small">Today Window</button>
      <button id="viewAllBtn" class="btn small secondary">Show All</button>
      <select id="summaryRange" class="select">
        <option value="">Summary View</option><option value="thisWeek">This Week</option><option value="lastWeek">Last Week</option><option value="thisMonth">This Month</option><option value="lastMonth">Last Month</option>
      </select>
    </section>

    <section class="legend"><span><i class="dot pending"></i>Pending</span><span><i class="dot today"></i>Today</span><span><i class="dot locked"></i>Locked</span></section>
    <section id="summaryPanel" class="summary-panel hidden"></section>
    <section id="daysList" class="days-list" aria-label="Days list"></section>
  </main>

  <dialog id="dayDialog" class="modal">
    <form id="dayForm" class="form-grid" method="dialog">
      <div class="modal-header"><h2 id="formDateTitle"></h2><button type="button" id="closeDayDialog" class="btn ghost">✕</button></div>
      <label>Plan<textarea name="plan" required></textarea></label>
      <label>Tasks Completed (one per line)<textarea name="tasksCompleted"></textarea></label>

      <fieldset>
        <legend>Workout</legend>
        <label>Planned Workout<textarea name="workoutPlanned" readonly></textarea></label>
        <label>Workout Done<select name="workoutDone" required><option value="">Select</option><option value="yes">Yes</option><option value="no">No</option></select></label>
      </fieldset>

      <fieldset>
        <legend>Diet</legend>
        <label>Planned Diet<textarea name="dietPlanned" readonly></textarea></label>
        <label>Diet Followed<select name="dietFollowed" required><option value="">Select</option><option value="yes">Yes</option><option value="no">No</option></select></label>
      </fieldset>

      <fieldset>
        <legend>Expenses</legend>
        <div id="expenseItems"></div>
        <button type="button" id="addExpenseBtn" class="btn small secondary">+ Add Expense</button>
        <label>Total Expense<input type="number" name="expenseTotal" readonly /></label>
      </fieldset>

      <label>Note<textarea name="note"></textarea></label>
      <section class="score-box" id="scorePreview"></section>
      <div class="action-row">
        <button id="saveBtn" class="btn secondary" type="button">Save</button>
        <button id="lockBtn" class="btn" type="submit">Save & Lock Day</button>
      </div>
    </form>
  </dialog>

  <dialog id="configDialog" class="modal">
    <form id="configForm" class="form-grid" method="dialog">
      <div class="modal-header"><h2>Weekly Config</h2><button type="button" id="closeConfigDialog" class="btn ghost">✕</button></div>
      <div id="weekdayConfigContainer"></div>
      <button class="btn" type="submit">Save Weekly Config</button>
    </form>
  </dialog>

  <dialog id="goalsDialog" class="modal">
    <form id="goalsForm" class="form-grid" method="dialog">
      <div class="modal-header"><h2>Goals</h2><button type="button" id="closeGoalsDialog" class="btn ghost">✕</button></div>
      <label>Weekly Goal<textarea name="weeklyGoal"></textarea></label>
      <label>Monthly Goal<textarea name="monthlyGoal"></textarea></label>
      <label>End Goal<textarea name="endGoal"></textarea></label>
      <button class="btn" type="submit">Save Goals</button>
    </form>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
