<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1619-Day Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>1619-Day Tracker</h1>
    <button id="openConfigBtn" class="btn secondary">Weekly Config</button>
  </header>

  <main class="app-main">
    <section class="legend">
      <span><i class="dot pending"></i>Pending</span>
      <span><i class="dot today"></i>Today</span>
      <span><i class="dot complete"></i>Completed</span>
    </section>

    <section id="daysList" class="days-list" aria-label="Days list"></section>
  </main>

  <dialog id="dayDialog" class="modal">
    <form id="dayForm" class="form-grid" method="dialog">
      <div class="modal-header">
        <h2 id="formDateTitle"></h2>
        <button type="button" id="closeDayDialog" class="btn ghost">✕</button>
      </div>

      <label>Plan
        <textarea name="plan" required></textarea>
      </label>

      <label>Top 3 Priorities (one per line)
        <textarea name="priorities" required></textarea>
      </label>

      <label>Tasks Planned (one per line)
        <textarea name="tasksPlanned" required></textarea>
      </label>

      <label>Tasks Completed (one per line)
        <textarea name="tasksCompleted"></textarea>
      </label>

      <fieldset>
        <legend>Workout</legend>
        <label>Planned
          <input name="workoutPlanned" readonly />
        </label>
        <label>Done
          <select name="workoutDone" required>
            <option value="">Select</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
          </select>
        </label>
        <label>Details
          <textarea name="workoutDetails"></textarea>
        </label>
        <label>Duration (min)
          <input type="number" name="workoutDuration" min="0" />
        </label>
        <label>Intensity (1-10)
          <input type="number" name="workoutIntensity" min="1" max="10" />
        </label>
      </fieldset>

      <fieldset>
        <legend>Diet</legend>
        <label>Planned
          <input name="dietPlanned" readonly />
        </label>
        <label>Followed
          <select name="dietFollowed" required>
            <option value="">Select</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
          </select>
        </label>
        <label>Meals
          <textarea name="dietMeals"></textarea>
        </label>
        <label>Notes
          <textarea name="dietNotes"></textarea>
        </label>
      </fieldset>

      <fieldset>
        <legend>Expenses</legend>
        <label>Total
          <input type="number" name="expenseTotal" min="0" step="0.01" />
        </label>
        <label>Categories (JSON or comma list)
          <textarea name="expenseCategories"></textarea>
        </label>
      </fieldset>

      <label>Reflection
        <textarea name="reflection"></textarea>
      </label>

      <label>Wins
        <textarea name="wins"></textarea>
      </label>

      <label>Improvement Notes
        <textarea name="improvements"></textarea>
      </label>

      <section class="score-box" id="scorePreview"></section>

      <button id="submitBtn" class="btn" type="submit">Save & Lock Day</button>
    </form>
  </dialog>

  <dialog id="configDialog" class="modal">
    <form id="configForm" class="form-grid" method="dialog">
      <div class="modal-header">
        <h2>Weekly Config</h2>
        <button type="button" id="closeConfigDialog" class="btn ghost">✕</button>
      </div>
      <div id="weekdayConfigContainer"></div>
      <button class="btn" type="submit">Save Weekly Config</button>
    </form>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
